apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: example
type: Opaque
data:
  # Values are base64 encoded
  # echo -n 'mysecretpassword' | base64
  DATABASE_PASSWORD: bXlzZWNyZXRwYXNzd29yZA==
  API_KEY: c2VjcmV0LWFwaS1rZXktMTIzNDU2
  
# To create from literal values:
# kubectl create secret generic app-secret \
#   --from-literal=DATABASE_PASSWORD=mysecretpassword \
#   --from-literal=API_KEY=secret-api-key-123456
