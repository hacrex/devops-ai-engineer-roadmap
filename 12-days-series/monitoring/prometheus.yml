global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  # ChromaDB metrics (Day 09)
  - job_name: 'chromadb'
    static_configs:
      - targets: ['chromadb:8000']
    metrics_path: '/metrics'
  
  # API Server monitoring (Day 10)
  - job_name: 'api-server'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
  
  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
  
  # PostgreSQL metrics (requires postgres exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
